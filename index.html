<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Base href: Flutter lo reemplaza según --base-href en el build -->
  <base href="/">

  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">

  <!-- Mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f9d58">

  <!-- App meta -->
  <title>RaffleFast</title>
  <meta name="application-name" content="RaffleFast">
  <meta name="apple-mobile-web-app-title" content="RaffleFast">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="RaffleFast — customer registration and live raffle management.">

  <!-- SEO / Social (opcional; usa favicon si no tienes imagen dedicada) -->
  <meta property="og:title" content="RaffleFast">
  <meta property="og:description" content="Register customers and run raffles live, fast.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="favicon.png">
  <meta name="twitter:card" content="summary">

  <!-- Icons / PWA -->
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <!-- Small safety: tell crawlers it's a SPA -->
  <meta name="robots" content="index,follow">
  <style>
    /* Evita flash blanco durante el bootstrap */
    html, body { height: 100%; margin: 0; background: #0b0d0f; }
    /* Hint de carga opcional (no bloquea Flutter) */
    .boot-hint { position: fixed; inset: 0; display: grid; place-items: center; color: #e6f4ea; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
  </style>
</head>
<body>
  <noscript>Please enable JavaScript to run RaffleFast.</noscript>
  <div class="boot-hint" id="bootHint">Loading RaffleFast…</div>

  <script>
    // Quita el hint cuando Flutter arranca
    window.addEventListener('flutter-first-frame', () => {
      const el = document.getElementById('bootHint');
      if (el) el.remove();
    }, { once: true });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
